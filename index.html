<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FRED Explorer — Browse, transform &amp; correlate economic data</title>
<style>
  :root {
    --ink: #0d1b2a; --ink-2: #34465a; --muted: #6b7c8f; --faint: #9aa8b6;
    --line: #e6e9ef; --line-strong: #d5dbe3; --paper: #ffffff; --page: #f4f6f9;
    --brand: #0e8f6e; --pos: #1a936f; --neg: #d1495b; --accent2: #2f6f9f;
    --shadow: 0 1px 2px rgba(13,27,42,.04), 0 8px 24px rgba(13,27,42,.06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--page); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .controls { background: var(--paper); border-right: 1px solid var(--line); padding: 26px 22px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
  @media (max-width: 900px) { .controls { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); } }
  .brandmark { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
  .brandmark .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); box-shadow: 0 0 0 4px rgba(14,143,110,.14); }
  .brandmark b { font-size: .95rem; } .brandmark span { color: var(--faint); font-size: .78rem; }
  .ctl { margin-bottom: 18px; }
  .ctl label { display: block; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 7px; }
  .ctl label .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 5px; }
  select, .ctl input { width: 100%; font-family: var(--sans); font-size: .9rem; color: var(--ink); background: #fbfcfd; border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 11px; outline: none; }
  select:focus, .ctl input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,143,110,.12); }
  .seg { display: flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fbfcfd; padding: 8px 4px; font-size: .8rem; color: var(--muted); cursor: pointer; font-family: var(--sans); }
  .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }
  .btn { width: 100%; border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 9px; padding: 10px; font-size: .85rem; cursor: pointer; font-family: var(--sans); font-weight: 600; margin-top: 4px; }
  .btn:hover { filter: brightness(1.05); }
  .hint { font-size: .74rem; color: var(--faint); margin-top: 14px; line-height: 1.45; }

  .stage { padding: 34px; overflow-x: hidden; }
  @media (max-width: 900px) { .stage { padding: 20px; } }
  .sheet { max-width: 960px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 40px 44px 34px; }
  @media (max-width: 640px) { .sheet { padding: 26px 20px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
  .sheet-head .title { font-family: var(--serif); font-size: 1.9rem; line-height: 1.12; letter-spacing: -.01em; margin: 0; }
  .sheet-head .period { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .sheet-head .tag { text-align: right; color: var(--faint); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
  .sheet-head .tag b { display: block; color: var(--brand); font-size: .8rem; letter-spacing: .05em; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
  @media (max-width: 780px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { padding: 15px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kpi:nth-child(4n) { border-right: none; }
  @media (max-width: 780px) { .kpi:nth-child(2n) { border-right: none; } }
  .kpi .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .kpi .v { font-size: 1.4rem; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi .v.pos { color: var(--pos); } .kpi .v.neg { color: var(--neg); }

  .block { margin-bottom: 26px; }
  .block h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 12px; font-weight: 700; }
  .chart-wrap { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 8px; background: linear-gradient(180deg,#fff,#fcfdfe); }
  svg { display: block; width: 100%; height: auto; }
  .axis { fill: var(--faint); font-size: 11px; font-family: var(--sans); }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .legend { display: flex; gap: 20px; margin: 12px 4px 2px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .two-col { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: start; }
  @media (max-width: 780px) { .two-col { grid-template-columns: 1fr; } }
  .note { font-size: .85rem; color: var(--muted); }
  .note b { color: var(--ink); }
  .sheet-foot { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: .74rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media print {
    .controls { display: none; } .app { display: block; } body { background: #fff; }
    .stage { padding: 0; } .sheet { border: none; box-shadow: none; max-width: none; border-radius: 0; padding: 0; }
    .chart-wrap { background: #fff; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <div class="brandmark"><span class="dot"></span><b>FRED Explorer</b><span>· economic data</span></div>

    <div class="ctl">
      <label for="serA"><span class="swatch" style="background:var(--brand)"></span>Series A</label>
      <select id="serA"></select>
    </div>
    <div class="ctl">
      <label for="serB"><span class="swatch" style="background:var(--accent2)"></span>Series B (compare)</label>
      <select id="serB"></select>
    </div>
    <div class="ctl">
      <label for="tf">Transformation</label>
      <select id="tf">
        <option value="level">Level (raw)</option>
        <option value="yoy">Year-over-year % change</option>
        <option value="mom">Month-over-month % change</option>
        <option value="chg">Change (Δ)</option>
        <option value="rebase">Rebase to 100</option>
        <option value="z">Z-score (standardize)</option>
      </select>
    </div>
    <div class="ctl">
      <label>Date range</label>
      <div class="seg" id="range">
        <button data-y="10">10Y</button>
        <button data-y="20">20Y</button>
        <button data-y="30" class="active">30Y</button>
        <button data-y="0">Max</button>
      </div>
    </div>
    <button class="btn" id="print">Print / PDF</button>
    <div class="hint">All data is bundled into this page — no API key, no network calls, works offline. Series are public-domain U.S. macro data from FRED. Educational tool, not investment advice.</div>
  </aside>

  <main class="stage"><div class="sheet" id="sheet"></div></main>
</div>

  var META = BUNDLE.meta, SERIES = BUNDLE.series;
  var byId = {}; META.forEach(function (m) { byId[m.id] = m; });

  var state = { a: "GS10", b: "FEDFUNDS", tf: "level", years: 30 };

  function mIdx(ym) { var p = ym.split("-"); return (+p[0]) * 12 + (+p[1] - 1); }
  function idxToLabel(idx) { var y = Math.floor(idx / 12); return "" + y; }

  // absolute-index value accessor for a series
  function valAt(id, idx) {
    var s = SERIES[id], base = mIdx(s.start), i = idx - base;
    if (i < 0 || i >= s.values.length) return null;
    var v = s.values[i]; return v == null ? null : v;
  }
  function lastIdx(id) { var s = SERIES[id]; return mIdx(s.start) + s.values.length - 1; }
  function firstIdx(id) { return mIdx(SERIES[id].start); }

  // apply transform to a series across [w0..w1] absolute indices → array aligned to window
  function transform(id, tf, w0, w1) {
    var out = [];
    // rebase base = first non-null in window
    var base = null;
    if (tf === "rebase") { for (var k = w0; k <= w1; k++) { var vv = valAt(id, k); if (vv != null && vv !== 0) { base = vv; break; } } }
    // z-score stats over window
    var mean = 0, sd = 0;
    if (tf === "z") {
      var xs = []; for (var j = w0; j <= w1; j++) { var v = valAt(id, j); if (v != null) xs.push(v); }
      if (xs.length) { for (var a = 0; a < xs.length; a++) mean += xs[a]; mean /= xs.length;
        for (var b = 0; b < xs.length; b++) sd += (xs[b] - mean) * (xs[b] - mean); sd = Math.sqrt(sd / xs.length); }
    }
    for (var idx = w0; idx <= w1; idx++) {
      var cur = valAt(id, idx), r = null;
      if (cur != null) {
        if (tf === "level") r = cur;
        else if (tf === "yoy") { var p = valAt(id, idx - 12); if (p != null && p !== 0) r = (cur / p - 1) * 100; }
        else if (tf === "mom") { var p1 = valAt(id, idx - 1); if (p1 != null && p1 !== 0) r = (cur / p1 - 1) * 100; }
        else if (tf === "chg") { var p2 = valAt(id, idx - 1); if (p2 != null) r = cur - p2; }
        else if (tf === "rebase") { r = base != null ? cur / base * 100 : null; }
        else if (tf === "z") { r = sd > 0 ? (cur - mean) / sd : null; }
      }
      out.push(r);
    }
    return out;
  }

  var TF_LABEL = { level: "Level", yoy: "YoY % change", mom: "MoM % change", chg: "Change (Δ)", rebase: "Rebase to 100", z: "Z-score" };
  var TF_UNIT = { yoy: "%", mom: "%", rebase: "index", z: "σ" };
  function sharedScale(tf) { return tf === "rebase" || tf === "z"; }

  function fmt(v, dec) { if (v == null || !isFinite(v)) return "—"; dec = dec == null ? 2 : dec; if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString("en-US"); return v.toFixed(dec); }
  function pearson(pairs) {
    var n = pairs.length; if (n < 3) return null;
    var mx = 0, my = 0; pairs.forEach(function (p) { mx += p[0]; my += p[1]; }); mx /= n; my /= n;
    var sxy = 0, sxx = 0, syy = 0;
    pairs.forEach(function (p) { var dx = p[0] - mx, dy = p[1] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; });
    if (sxx <= 0 || syy <= 0) return null;
    return sxy / Math.sqrt(sxx * syy);
  }

  var W = 880;
  function lineChart(timeline, A, B, opts) {
    var H = 300, padL = 54, padR = B && !opts.shared ? 54 : 16, padT = 14, padB = 24;
    var iw = W - padL - padR, ih = H - padT - padB, n = timeline.length;
    function ext(arr) { var mn = Infinity, mx = -Infinity; arr.forEach(function (v) { if (v != null) { if (v < mn) mn = v; if (v > mx) mx = v; } }); if (mn === Infinity) { mn = 0; mx = 1; } if (mn === mx) { mn -= 1; mx += 1; } var pad = (mx - mn) * .08; return [mn - pad, mx + pad]; }
    var la, ra;
    if (opts.shared && B) { var all = A.concat(B); la = ext(all); ra = la; }
    else { la = ext(A); ra = B ? ext(B) : la; }
    var x = function (i) { return padL + iw * (n === 1 ? .5 : i / (n - 1)); };
    var yL = function (v) { return padT + ih - ih * (v - la[0]) / (la[1] - la[0]); };
    var yR = function (v) { return padT + ih - ih * (v - ra[0]) / (ra[1] - ra[0]); };

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">';
    for (var g = 0; g <= 4; g++) {
      var lv = la[0] + (la[1] - la[0]) * g / 4, yy = yL(lv);
      svg += '<line class="gridline" x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '"/>';
      svg += '<text class="axis" x="' + (padL - 8) + '" y="' + (yy + 3) + '" text-anchor="end">' + fmt(lv, 1) + '</text>';
      if (B && !opts.shared) { var rv = ra[0] + (ra[1] - ra[0]) * g / 4; svg += '<text class="axis" x="' + (W - padR + 8) + '" y="' + (yy + 3) + '" text-anchor="start" style="fill:var(--accent2)">' + fmt(rv, 1) + '</text>'; }
    }
    // x labels
    var ticks = 6; for (var t = 0; t <= ticks; t++) { var ix = Math.round((n - 1) * t / ticks); var anchor = t === 0 ? "start" : t === ticks ? "end" : "middle"; svg += '<text class="axis" x="' + x(ix) + '" y="' + (H - 7) + '" text-anchor="' + anchor + '">' + idxToLabel(timeline[ix]) + '</text>'; }

    function path(arr, yf) {
      var d = "", pen = false;
      for (var i = 0; i < arr.length; i++) { if (arr[i] == null) { pen = false; continue; } var px = x(i).toFixed(1), py = yf(arr[i]).toFixed(1); d += (pen ? "L" : "M") + px + " " + py + " "; pen = true; }
      return d;
    }
    if (B) svg += '<path d="' + path(B, opts.shared ? yL : yR) + '" fill="none" stroke="var(--accent2)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
    svg += '<path d="' + path(A, yL) + '" fill="none" stroke="var(--brand)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
    svg += '</svg>';
    return svg;
  }

  function scatter(pairs) {
    var H = 300, pad = 40, iw = 320 - pad - 12, ih = H - pad - 24; var VB = 320;
    function ext(k) { var mn = Infinity, mx = -Infinity; pairs.forEach(function (p) { var v = p[k]; if (v < mn) mn = v; if (v > mx) mx = v; }); if (mn === mx) { mn -= 1; mx += 1; } var pd = (mx - mn) * .08; return [mn - pd, mx + pd]; }
    var xe = ext(0), ye = ext(1);
    var x = function (v) { return pad + iw * (v - xe[0]) / (xe[1] - xe[0]); };
    var y = function (v) { return pad - 12 + ih - ih * (v - ye[0]) / (ye[1] - ye[0]); };
    var svg = '<svg viewBox="0 0 ' + VB + ' ' + H + '" style="height:' + H + 'px">';
    for (var g = 0; g <= 3; g++) { var yy = (pad - 12) + ih * g / 3; svg += '<line class="gridline" x1="' + pad + '" y1="' + yy + '" x2="' + (VB - 12) + '" y2="' + yy + '"/>'; }
    pairs.forEach(function (p) { svg += '<circle cx="' + x(p[0]).toFixed(1) + '" cy="' + y(p[1]).toFixed(1) + '" r="2.4" fill="var(--brand)" fill-opacity="0.5"/>'; });
    svg += '<text class="axis" x="' + (VB / 2) + '" y="' + (H - 4) + '" text-anchor="middle">Series A →</text>';
    svg += '<text class="axis" x="12" y="' + (pad - 18) + '" text-anchor="start">Series B ↑</text>';
    svg += '</svg>';
    return svg;
  }

  function render() {
    var a = state.a, b = state.b === "none" ? null : state.b, tf = state.tf;
    // window
    var end = b ? Math.max(lastIdx(a), lastIdx(b)) : lastIdx(a);
    var earliest = b ? Math.min(firstIdx(a), firstIdx(b)) : firstIdx(a);
    var w0 = state.years === 0 ? earliest : Math.max(earliest, end - state.years * 12 + 1);
    var timeline = []; for (var k = w0; k <= end; k++) timeline.push(k);

    var A = transform(a, tf, w0, end);
    var B = b ? transform(b, tf, w0, end) : null;

    var shared = sharedScale(tf);
    var ma = byId[a], mb = b ? byId[b] : null;

    // correlation pairs
    var pairs = [];
    if (B) for (var i = 0; i < A.length; i++) if (A[i] != null && B[i] != null) pairs.push([A[i], B[i]]);
    var r = B ? pearson(pairs) : null;

    var latestA = null; for (var la2 = A.length - 1; la2 >= 0; la2--) if (A[la2] != null) { latestA = A[la2]; break; }
    var latestB = null; if (B) for (var lb = B.length - 1; lb >= 0; lb--) if (B[lb] != null) { latestB = B[lb]; break; }

    var unit = TF_UNIT[tf] || (ma.unit);
    var yearsSpan = ((end - w0 + 1) / 12).toFixed(0);

    var html = "";
    html += '<div class="sheet-head"><div>';
    html += '<h1 class="title">' + ma.name + (mb ? '  vs  ' + mb.name : '') + '</h1>';
    html += '<div class="period">' + TF_LABEL[tf] + ' · ' + idxToLabel(w0) + '–' + idxToLabel(end) + ' · ' + yearsSpan + ' years</div>';
    html += '</div><div class="tag">FRED<b>Explorer</b></div></div>';

    html += '<div class="kpis">';
    html += '<div class="kpi"><div class="k">Latest — ' + ma.id + '</div><div class="v" style="color:var(--brand)">' + fmt(latestA) + '</div></div>';
    if (mb) {
      html += '<div class="kpi"><div class="k">Latest — ' + mb.id + '</div><div class="v" style="color:var(--accent2)">' + fmt(latestB) + '</div></div>';
      var rc = r == null ? "" : (r >= 0 ? "pos" : "neg");
      html += '<div class="kpi"><div class="k">Correlation (r)</div><div class="v ' + rc + '">' + (r == null ? "—" : r.toFixed(2)) + '</div></div>';
      html += '<div class="kpi"><div class="k">Paired months</div><div class="v">' + pairs.length + '</div></div>';
    } else {
      var mn = Infinity, mx = -Infinity; A.forEach(function (v) { if (v != null) { if (v < mn) mn = v; if (v > mx) mx = v; } });
      html += '<div class="kpi"><div class="k">Minimum</div><div class="v">' + fmt(mn) + '</div></div>';
      html += '<div class="kpi"><div class="k">Maximum</div><div class="v">' + fmt(mx) + '</div></div>';
      html += '<div class="kpi"><div class="k">Months</div><div class="v">' + timeline.length + '</div></div>';
    }
    html += '</div>';

    html += '<div class="block"><h3>' + TF_LABEL[tf] + (unit ? ' · ' + unit : '') + '</h3><div class="chart-wrap">' + lineChart(timeline, A, B, { shared: shared }) + '</div>';
    html += '<div class="legend"><span><i class="swatch" style="background:var(--brand)"></i> ' + ma.name + ' <span style="color:var(--faint)">(' + ma.unit + ')</span></span>';
    if (mb) html += '<span><i class="swatch" style="background:var(--accent2)"></i> ' + mb.name + ' <span style="color:var(--faint)">(' + mb.unit + ')</span></span>';
    if (mb && !shared) html += '<span style="color:var(--faint)">left axis = A · right axis = B</span>';
    html += '</div></div>';

    if (mb) {
      html += '<div class="two-col">';
      html += '<div class="block"><h3>Scatter — A vs B</h3><div class="chart-wrap">' + (pairs.length >= 3 ? scatter(pairs) : '<div class="note" style="padding:20px">Not enough overlapping data to plot.</div>') + '</div></div>';
      html += '<div class="block"><h3>Reading the relationship</h3><p class="note">';
      if (r == null) html += 'Not enough overlapping observations to compute a correlation.';
      else {
        var strength = Math.abs(r) >= .8 ? "very strong" : Math.abs(r) >= .6 ? "strong" : Math.abs(r) >= .4 ? "moderate" : Math.abs(r) >= .2 ? "weak" : "little to no";
        var dir = r >= 0 ? "positive" : "negative";
        html += 'Over this window, <b>' + ma.name + '</b> and <b>' + mb.name + '</b> show a <b>' + strength + ' ' + dir + '</b> linear relationship (r = ' + r.toFixed(2) + ', ' + pairs.length + ' paired months).';
        html += ' r² = ' + (r * r).toFixed(2) + ', so about <b>' + Math.round(r * r * 100) + '%</b> of the variation in one moves with the other. Correlation is not causation — try different transformations and windows.';
      }
      html += '</p></div></div>';
    }

    html += '<div class="sheet-foot"><span>Data: FRED (Federal Reserve Bank of St. Louis) · public-domain series · bundled ' + BUNDLE.built + '</span><span>Educational — not investment advice</span></div>';

    $("sheet").innerHTML = html;
  }

  // build selects grouped by category
  function fillSelect(sel, includeNone) {
    var cats = {}; META.forEach(function (m) { (cats[m.cat] = cats[m.cat] || []).push(m); });
    var html = includeNone ? '<option value="none">— None (single series) —</option>' : '';
    Object.keys(cats).forEach(function (c) {
      html += '<optgroup label="' + c + '">';
      cats[c].forEach(function (m) { html += '<option value="' + m.id + '">' + m.name + '</option>'; });
      html += '</optgroup>';
    });
    sel.innerHTML = html;
  }
  fillSelect($("serA"), false); $("serA").value = state.a;
  fillSelect($("serB"), true); $("serB").value = state.b;
  $("tf").value = state.tf;

  $("serA").addEventListener("change", function () { state.a = this.value; render(); });
  $("serB").addEventListener("change", function () { state.b = this.value; render(); });
  $("tf").addEventListener("change", function () { state.tf = this.value; render(); });
  $("range").addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON") return;
    state.years = +e.target.getAttribute("data-y");
    [].forEach.call(this.querySelectorAll("button"), function (btn) { btn.classList.toggle("active", btn === e.target); });
    render();
  });
  $("print").addEventListener("click", function () { window.print(); });

  render();
})();
</script>
</body>
</html>
